// ─── PUNTEN BEREKENING ──────────────────────────────────────────────────────
// wkpooltjes.nl: exact=200, juiste uitslag=75, 1 team=20
function calcPts(pred,real){
  if(!pred||!real)return 0;
  const ph=pred.home,pa=pred.away,rh=real.home,ra=real.away;
  if(ph===rh&&pa===ra)return 200; // exacte score
  const pr=ph>pa?"h":pa>ph?"a":"d";
  const rr=rh>ra?"h":ra>rh?"a":"d";
  if(pr===rr)return 75; // juiste winnaar/gelijkspel
  if(ph===rh||pa===ra)return 20; // 1 team goed
  return 0;
}

function totPts(){
  let p=0;
  // Gespeelde wedstrijden
  Object.entries(RES).forEach(([id,real])=>{
    p+=calcPts(P[id],real);
  });
  // Bonus
  if(BN.k)p+=300;if(BN.t)p+=300;
  return p;
}

function maxPts(){
  let p=GM.length*200+KO.reduce((s,r)=>s+r.matches.length,0)*200;
  if(BN.k)p+=300;if(BN.t)p+=300;return p;
}

function toUTC(dtStr){return new Date(dtStr);}
function status(m){
  if(!m.dt)return"open";
  const now=new Date(),kick=toUTC(m.dt),diff=(kick-now)/60000;
  if(diff<0)return"locked";
  if(diff<120)return"urgent";
  if(diff<1440)return"soon";
  return"open";
}
function fmtTime(dtStr){
  if(!dtStr)return"";
  try{return new Date(dtStr).toLocaleString("nl-NL",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}
  catch(e){return dtStr;}
}
function res(h,a){return h>a?"h":a>h?"a":"d";}
function conf(h,a){const d=Math.abs(str(h)-str(a));return d>20?"Hoog":d>10?"Gemiddeld":"Laag";}
function upHdr(){document.getElementById("totalPts").textContent=totPts().toLocaleString("nl");}
function urgGrps(){const u=new Set();GM.forEach(m=>{const s=status(m);if(s==="urgent"||s==="soon")u.add(m.g);});return u;}

// ─── AI HELPERS ──────────────────────────────────────────────────────────────
function extractScore(txt){
  const m=txt.match(/"predictedScore"\s*:\s*\{\s*"home"\s*:\s*(\d+)\s*,\s*"away"\s*:\s*(\d+)/);
  return m?{home:parseInt(m[1]),away:parseInt(m[2])}:null;
}
function extractField(txt,field){
  const m=txt.match(new RegExp('"'+field+'"\\s*:\\s*"([^"]{0,500})"'));
  return m?m[1]:null;
}
function safeJsonParse(txt){
  // Strip markdown fences
  let s=txt.replace(/```json\s*/gi,"").replace(/```\s*/g,"").trim();
  // Find outermost object
  const i=s.indexOf("{"), j=s.lastIndexOf("}");
  if(i===-1||j===-1)return null;
  s=s.slice(i,j+1);
  // Fix unescaped newlines/tabs inside string values using char-by-char scan
  let out="",inStr=false,esc=false;
  for(let k=0;k<s.length;k++){
    const c=s[k];
    if(esc){out+=c;esc=false;continue;}
    if(c==="\\"){out+=c;esc=true;continue;}
    if(c==='"'){inStr=!inStr;out+=c;continue;}
    if(inStr){
      if(c==="\n"){out+="\\n";continue;}
      if(c==="\r"){continue;}
      if(c==="\t"){out+=" ";continue;}
    }
    out+=c;
  }
  // Remove control chars
  out=out.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,"");
  try{return JSON.parse(out);}catch(e){return null;}
}

function render(){
  const el=document.getElementById("con");
  if(TAB==="m")el.innerHTML=rM();

  else if(TAB==="o")el.innerHTML=rO();
  else if(TAB==="ko")el.innerHTML=rKO();
  else el.innerHTML=rS();
  if(EX){
    const aip=document.getElementById("aip-"+EX);
    if(aip){
      const gm=GM.find(x=>x.id===EX);
      if(gm){
        if(AIR[EX]||AIL[EX])drawAI(EX,gm.h,gm.a,"");
        else aip.innerHTML=`<div style="display:flex;align-items:center;gap:7px;margin-bottom:10px"><div class="adot"></div><span class="atl">AI Analyse</span></div><input class="ainp" id="actx-${EX}" placeholder="Extra context of poulegenoten..."><button class="abtn" onclick="goAI('${EX}','${gm.h.replace(/'/g,"\\'")}','${gm.a.replace(/'/g,"\\'")}')">&#x1F50D; Analyseer</button>`;
      } else {
        // KO match — zoek teams op via qualifiers
        const qualifiers=calcQualifiers();
        let koH=null,koA=null,koLbl="";
        let b8i=0;
        KO.forEach(r=>r.matches.forEach(m=>{
          if(m.id===EX){

            if(parts.length===2){

              koA=resolveKOTeam(parts[1].trim(),qualifiers,b8i)||parts[1].trim();
            }
          }
        }));
        if(koH&&koA){
          if(AIR[EX]||AIL[EX])drawAI(EX,koH,koA,"");

let FETCH_LOADING=false;

async function fetchAllResults(){
  if(FETCH_LOADING)return;
  FETCH_LOADING=true;
  render();
  // Build list of matches that have been played but have no result yet
  const missing=GM.filter(m=>status(m)==="locked"&&!RES[m.id]);
  const recent=GM.filter(m=>status(m)==="locked"&&RES[m.id]);
  // Also include matches played in last 3 days to allow corrections
  const allPlayed=GM.filter(m=>status(m)==="locked");
  if(allPlayed.length===0){
    FETCH_LOADING=false;
    alert("Er zijn nog geen gespeelde wedstrijden.");
    return;
  }
  // Build match list for the prompt
  const matchList=allPlayed.map(m=>`${m.id}: ${m.h} vs ${m.a} (${fmtTime(m.dt)})`).join("\n");
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:2000,
        tools:[{type:"web_search_20250305",name:"web_search"}],
        system:`Je bent een voetbaldata-assistent. Zoek de officiële eindstanden op van gespeelde WK 2026 wedstrijden.
Zoek meerdere keren om alle uitslagen te vinden. Gebruik bronnen als FIFA.com, NOS.nl, ESPN.
Geef ALLEEN geldige JSON terug zonder markdown. Formaat:
{"results":[{"id":"A1","home":2,"away":0},{"id":"B1","home":1,"away":1}]}
Gebruik alleen de exacte wedstrijd-IDs die je ontvangt. Als een uitslag onbekend is, laat die ID weg.
Gebruik de stand na 90 minuten + blessuretijd (geen verlenging/penalties tenzij gevraagd).`,
        messages:[{role:"user",content:`Zoek de officiële eindstanden van deze gespeelde WK 2026 groepswedstrijden op (vandaag: ${new Date().toLocaleDateString("nl-NL")}):\n\n${matchList}\n\nGeef alle bekende uitslagen terug als JSON.`}]
      })
    });
    const d=await r.json();
    let txt="";
    if(d.content)for(const b of d.content)if(b.type==="text")txt+=b.text;
    let cl=txt.replace(/```json\s*/gi,"").replace(/```\s*/g,"").trim();
    const start=cl.indexOf("{");
    const end=cl.lastIndexOf("}");
    if(start===-1||end===-1)throw new Error("Geen JSON gevonden");
    let jsonStr=cl.slice(start,end+1);
    jsonStr=jsonStr.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,"");
    const parsed=JSON.parse(jsonStr);
    let count=0;
    if(parsed.results&&Array.isArray(parsed.results)){
      parsed.results.forEach(r=>{
        if(r.id&&typeof r.home==="number"&&typeof r.away==="number"&&r.home>=0&&r.away>=0){
          RES[r.id]={home:r.home,away:r.away};
          count++;
        }
      });
      save();
    }
    FETCH_LOADING=false;
    render();
    if(count>0)alert(`✓ ${count} uitslag(en) opgehaald en opgeslagen!`);
    else alert("Geen nieuwe uitslagen gevonden. Mogelijk zijn er nog geen wedstrijden gespeeld.");
  }catch(e){
    FETCH_LOADING=false;
    render();
    alert("Ophalen mislukt: "+e.message);
  }
}

</button>

</div>`;

  if(notPlayed.length>0){
    html+=`<div style="background:#1a1000;border:1px solid #f5a62330;border-radius:8px;padding:10px;margin-bottom:12px;font-size:11px;color:var(--o)">&#x26A0; ${notPlayed.length} wedstrijd(en) gespeeld maar nog geen uitslag &mdash; klik op de knop hierboven.</div>`;

  // Group by group
  const grps=["A","B","C","D","E","F","G","H","I","J","K","L"];
  grps.forEach(g=>{
    const ms=GM.filter(m=>m.g===g&&RES[m.id]);

      const real=RES[m.id];
      html+=`<div class="orow"><span style="color:${rv==="h"?"#fff":"#666"};flex:1">${m.h}</span>${p?`<span class="osco">${p.home}&ndash;${p.away}</span>`:`<span class="omissing">?&ndash;?</span>`}<span style="color:${rv==="a"?"#fff":"#666"};flex:1;text-align:right">${m.a}</span>${real?`<span style="font-size:9px;color:var(--g);margin-left:5px">${real.home}&ndash;${real.away}</span>`:""}</div>`;
    });
    html+=`</div>`;
  });
  return html;
}

// ─── GROEPSSTAND BEREKENING ──────────────────────────────────────────────────
// Berekent stand op basis van RES (echte uitslagen) of P (voorspellingen)
function calcStanding(grp){
  const teams=GRPTEAMS[grp];
  const matches=GM.filter(m=>m.g===grp);
  const stats={};
  teams.forEach(t=>{stats[t]={pts:0,gd:0,gf:0,ga:0,played:0};});

  matches.forEach(m=>{
    // Gebruik echte uitslag als beschikbaar, anders voorspelling
    const s=RES[m.id]||P[m.id];
    if(!s)return;
    const h=m.h,a=m.a,sh=s.home,sa=s.away;
    stats[h].played++;stats[a].played++;
    stats[h].gf+=sh;stats[h].ga+=sa;stats[h].gd+=sh-sa;
    stats[a].gf+=sa;stats[a].ga+=sh;stats[a].gd+=sa-sh;
    if(sh>sa){stats[h].pts+=3;}
    else if(sh===sa){stats[h].pts+=1;stats[a].pts+=1;}
    else{stats[a].pts+=3;}
  });

  // Sortering: punten → doelsaldo → goals for → naam
  const sorted=teams.slice().sort((a,b)=>{
    if(stats[b].pts!==stats[a].pts)return stats[b].pts-stats[a].pts;
    if(stats[b].gd!==stats[a].gd)return stats[b].gd-stats[a].gd;
    if(stats[b].gf!==stats[a].gf)return stats[b].gf-stats[a].gf;
    return a.localeCompare(b);
  });

  return sorted.map((t,i)=>({
    pos:i+1,team:t,
    pts:stats[t].pts,gd:stats[t].gd,gf:stats[t].gf,
    played:stats[t].played,
    hasData:stats[t].played>0
  }));
}

// Berekent alle groepswinnaars, nummers 2 en beste 8 nummers 3
function calcQualifiers(){
  const grps=["A","B","C","D","E","F","G","H","I","J","K","L"];
  const w={},r2={},thirds=[];

  grps.forEach(g=>{
    const s=calcStanding(g);
    w[g]=s[0]?.hasData?s[0].team:null;
    r2[g]=s[1]?.hasData?s[1].team:null;
    if(s[2]?.hasData)thirds.push({team:s[2].team,grp:g,
      pts:s[2].pts,gd:s[2].gd,gf:s[2].gf});
  });

  // Beste 8 nummers 3
  thirds.sort((a,b)=>{
    if(b.pts!==a.pts)return b.pts-a.pts;
    if(b.gd!==a.gd)return b.gd-a.gd;
    if(b.gf!==a.gf)return b.gf-a.gf;
    return a.team.localeCompare(b.team);
  });
  const best8=thirds.slice(0,8).map(x=>x.team);

  return{w,r2,thirds:thirds.map(x=>x.team),best8};
}

// Geeft de teamnaam voor een knockout slot
// lbl bevat bijv. "W Gr.A" of "Nr.2 Gr.B" of "Beste Nr.3"
function resolveKOTeam(lbl,qualifiers,best8idx){
  const{w,r2,best8}=qualifiers;
  const wm=lbl.match(/W\s+Gr\.([A-L])/);
  if(wm)return w[wm[1]]||null;
  const r2m=lbl.match(/Nr\.2\s+Gr\.([A-L])/);
  if(r2m)return r2[r2m[1]]||null;
  if(lbl.includes("Beste Nr.3")){
    const t=best8[best8idx||0];
    return t||null;
  }
  return null;
}

function switchTab(t){

function setAG(g){AG=g;EX=null;render();}
function chP(id,side,d){
  const p=P[id]||{home:0,away:0};
  if(side==="h")p.home=Math.max(0,p.home+d);else p.away=Math.max(0,p.away+d);
  P[id]=p;save();
  const vh=document.getElementById("sv-"+id+"-h"),va=document.getElementById("sv-"+id+"-a");

function chK(id,side,d){
  const p=KP[id]||{home:0,away:0};
  if(side==="h")p.home=Math.max(0,p.home+d);else p.away=Math.max(0,p.away+d);
  KP[id]=p;save();

function togKOEx(id,h,a){EX=(EX===id)?null:id;render();}
function saveRes(id){
  const h=parseInt(document.getElementById("ri-"+id+"-h")?.value);
  const a=parseInt(document.getElementById("ri-"+id+"-a")?.value);
  if(isNaN(h)||isNaN(a)||h<0||a<0)return alert("Vul een geldige uitslag in");

// ─── AUTOMATISERING ──────────────────────────────────────────────────────────
const AUTO={
  running:false,
  queue:[],
  log:[],
  resultsChecked:false
};

function addLog(msg,type="info"){
  AUTO.log.unshift({msg,type,time:new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})});
  if(AUTO.log.length>20)AUTO.log.pop();
  renderBanner();
}

function renderBanner(){
  let el=document.getElementById("autobanner");
  if(!el){
    el=document.createElement("div");
    el.id="autobanner";
    el.style.cssText="position:fixed;bottom:0;left:0;right:0;z-index:200;max-height:120px;overflow-y:auto;background:#0a0a18;border-top:1px solid #1a1a2e;padding:7px 12px;font-size:10px;";
    document.body.appendChild(el);
  }
  if(!AUTO.log.length){el.style.display="none";return;}
  el.style.display="block";
  const colors={"info":"#555","ok":"#00d4a0","warn":"#f5a623","busy":"#0098ff"};
  el.innerHTML=AUTO.log.slice(0,4).map(l=>`<div style="color:${colors[l.type]||"#555"};padding:1px 0">${l.time} ${l.msg}</div>`).join("");
}

// Auto uitslagen ophalen
async function autoFetchResults(){
  const missing=GM.filter(m=>status(m)==="locked"&&!RES[m.id]);
  if(!missing.length)return;
  addLog(`&#x1F4E1; ${missing.length} uitslag(en) ophalen...`,"busy");
  const matchList=missing.map(m=>`${m.id}: ${m.h} vs ${m.a}`).join("\n");
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:1500,
        tools:[{type:"web_search_20250305",name:"web_search"}],
        system:`Zoek officiële WK 2026 eindstanden. Geef ALLEEN JSON zonder markdown:
{"results":[{"id":"A1","home":2,"away":0}]}
Alleen bekende uitslagen. Stand na 90+blessuretijd.`,
        messages:[{role:"user",content:`WK 2026 uitslagen (${new Date().toLocaleDateString("nl-NL")}):\n${matchList}`}]
      })
    });
    const d=await r.json();
    let txt="";
    if(d.content)for(const b of d.content)if(b.type==="text")txt+=b.text;
    const parsed=safeJsonParse(txt);
    let count=0;
    if(parsed?.results){
      parsed.results.forEach(r=>{
        if(r.id&&typeof r.home==="number"&&typeof r.away==="number"){
          RES[r.id]={home:r.home,away:r.away};count++;
        }
      });
      save();
    }
    if(count>0){addLog(`&#x2713; ${count} uitslag(en) opgehaald`,"ok");render();}
    else addLog("Nog geen nieuwe uitslagen","info");
  }catch(e){addLog("Uitslagen ophalen mislukt","warn");}
}

// Auto AI analyse voor wedstrijden binnen 24u
async function autoAnalyze(){
  const now=new Date();
  // Wedstrijden binnen 24u die nog geen analyse hebben
  const toAnalyze=GM.filter(m=>{
    const kick=new Date(m.dt);
    const diff=(kick-now)/3600000;
    return diff>0&&diff<=24&&!AIR[m.id]&&!RES[m.id];
  });
  if(!toAnalyze.length)return;
  addLog(`&#x1F916; ${toAnalyze.length} analyse(s) starten...`,"busy");
  for(const m of toAnalyze){
    if(AIR[m.id])continue; // al gedaan
    addLog(`&#x27F3; Analyseer ${m.h} vs ${m.a}...`,"busy");
    try{
      await runAIauto(m.id,m.h,m.a);
      // Score automatisch overnemen
      if(AIR[m.id]&&AIR[m.id].predictedScore){
        const sc=AIR[m.id].predictedScore;
        P[m.id]={home:sc.home,away:sc.away};
        save();
        addLog(`&#x2713; ${m.h} vs ${m.a}: ${sc.home}-${sc.away} ingevuld`,"ok");
      }
    }catch(e){
      addLog(`Analyse ${m.h} vs ${m.a} mislukt`,"warn");
    }
    // Kleine pauze tussen analyses
    await new Promise(res=>setTimeout(res,1500));
  }
  render();
}

Score NOOIT aanpassen op poule-info.
KRITISCH: Alleen geldige JSON, geen markdown, strings max 120 tekens, geen enters in strings.
{"predictedScore":{"home":2,"away":1},"scorelineProbabilities":[{"score":"2-1","prob":18},{"score":"1-0","prob":14},{"score":"2-0","prob":12},{"score":"1-1","prob":11},{"score":"3-1","prob":8},{"score":"0-1","prob":6}],"alternativeScores":[{"home":1,"away":0}],"confidence":"Hoog","winProbabilities":{"home":55,"draw":25,"away":20},"expectedGoals":{"home":1.8,"away":1.1},"keyFactors":["f1","f2","f3","f4"],"tacticalMatchup":"tekst","formAnalysis":{"home":"tekst","away":"tekst"},"injuryReport":"tekst","headToHeadPattern":"tekst","bookmakerInsight":"tekst","locationFactor":"tekst","contextFactor":"tekst","popularPrediction":"tekst","pouleTip":"tekst"}`,
        messages:[{role:"user",content:`Analyseer WK 2026: ${h} vs ${a}. Voer meerdere searches uit voor actuele data.`}]

    });

// Notificatie banner bij opstarten
function showStartupNotification(){
  const now=new Date();
  // Wedstrijden die vandaag spelen
  const today=GM.filter(m=>{
    const kick=new Date(m.dt);
    const diff=(kick-now)/3600000;
    return diff>-3&&diff<=24;
  });
  const soon=GM.filter(m=>{
    const kick=new Date(m.dt);
    const diff=(kick-now)/3600000;
    return diff>0&&diff<=2;
  });
  const missing=GM.filter(m=>status(m)==="locked"&&!RES[m.id]);

  if(soon.length>0){
    addLog(`&#x26A0; ${soon.length} wedstrijd(en) beginnen binnen 2 uur!`,"warn");
  }
  if(today.length>0){
    addLog(`&#x26BD; ${today.length} wedstrijd(en) vandaag`,"info");
  }
  if(missing.length>0){
    addLog(`&#x1F4E1; ${missing.length} uitslag(en) ophalen...`,"busy");
  }
}

// Hoofd auto-routine bij opstarten
async function autoStart(){
  if(AUTO.running)return;
  AUTO.running=true;
  showStartupNotification();
  // Stap 1: uitslagen ophalen
  await autoFetchResults();
  // Stap 2: analyses voor wedstrijden binnen 24u
  await autoAnalyze();
  AUTO.running=false;
}

// Start automatisering na korte delay (laat UI eerst laden)
setTimeout(autoStart, 2000);
// Herhaal elke 30 minuten
setInterval(autoStart, 30*60*1000);
